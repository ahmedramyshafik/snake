<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: #080b11;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(32, 227, 178, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.06) 0%, transparent 50%);
      color: #f0f6fc;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .neon-glow-green {
      box-shadow: 0 0 25px rgba(32, 227, 178, 0.35);
    }

    .neon-text-green {
      text-shadow: 0 0 12px rgba(32, 227, 178, 0.7);
    }

    .neon-text-pink {
      text-shadow: 0 0 12px rgba(255, 42, 109, 0.7);
    }

    /* Custom scrollbar for game container if needed */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d131e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Directional Touch Pad styling */
    .d-pad-btn {
      background: linear-gradient(145deg, #182232, #0f1622);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.08s ease;
    }
    .d-pad-btn:active {
      transform: scale(0.92);
      background: linear-gradient(145deg, #20e3b2, #10b981);
      color: #080b11;
      box-shadow: 0 0 15px rgba(32, 227, 178, 0.6);
    }

    .modal-backdrop {
      background: rgba(8, 11, 17, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

  <!-- Main Container -->
  <main class="w-full max-w-xl flex flex-col items-center gap-4">
    
    <!-- Top Header & Scoreboard -->
    <header class="w-full flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h1 class="text-3xl sm:text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 neon-text-green flex items-center gap-2">
          <span>⚡</span> CYBER SNAKE
        </h1>
        
        <!-- Mute Sound Toggle -->
        <button id="soundToggle" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 transition-all flex items-center justify-center" aria-label="Toggle Sound">
          <svg id="soundIconOn" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path></svg>
          <svg id="soundIconOff" class="w-5 h-5 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-dasharray="2 2"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
        </button>
      </div>

      <!-- Stats Bar -->
      <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center justify-between shadow-lg">
        <div class="flex flex-col">
          <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Score</span>
          <span id="score" class="text-2xl sm:text-3xl font-black text-emerald-400">0</span>
        </div>
        
        <!-- Multiplier / Active Power-up indicator -->
        <div id="powerupStatus" class="hidden items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold animate-pulse">
          <span id="powerupIcon">⭐</span>
          <span id="powerupText">2x MULTIPLIER</span>
        </div>

        <div class="flex flex-col items-end">
          <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Best</span>
          <span id="best" class="text-2xl sm:text-3xl font-black text-cyan-400">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Play Area -->
    <div class="relative w-full aspect-square rounded-2xl overflow-hidden border-2 border-slate-800/80 bg-slate-950 shadow-2xl neon-glow-green">
      <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

      <!-- Overlay Menus (Start / Pause / Game Over) -->
      <div id="overlay" class="absolute inset-0 modal-backdrop flex flex-col items-center justify-center p-6 text-center transition-all duration-300 opacity-100 z-10">
        
        <!-- START / MENU MODE -->
        <div id="menuStart" class="flex flex-col items-center gap-5 w-full max-w-xs">
          <div class="space-y-1">
            <h2 class="text-3xl font-extrabold text-white">SELECT MODE</h2>
            <p class="text-xs text-slate-400">Choose your game speed & dynamic</p>
          </div>

          <div class="w-full grid grid-cols-1 gap-2.5">
            <button data-speed="easy" class="mode-btn py-3 px-4 rounded-xl bg-slate-800 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500 font-bold text-slate-200 transition-all flex justify-between items-center">
              <span>🟢 Relaxed</span>
              <span class="text-xs text-slate-400 font-normal">Slow & Smooth</span>
            </button>
            <button data-speed="medium" class="mode-btn py-3 px-4 rounded-xl bg-emerald-500/20 border-2 border-emerald-500 font-bold text-emerald-300 transition-all flex justify-between items-center shadow-lg shadow-emerald-500/10">
              <span>⚡ Classic</span>
              <span class="text-xs text-emerald-400 font-normal">Balanced</span>
            </button>
            <button data-speed="hard" class="mode-btn py-3 px-4 rounded-xl bg-slate-800 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500 font-bold text-slate-200 transition-all flex justify-between items-center">
              <span>🔥 Hyper</span>
              <span class="text-xs text-slate-400 font-normal">Lightning Fast</span>
            </button>
            <button data-speed="progressive" class="mode-btn py-3 px-4 rounded-xl bg-slate-800 hover:bg-cyan-600/30 border border-slate-700 hover:border-cyan-500 font-bold text-slate-200 transition-all flex justify-between items-center">
              <span>📈 Dynamic</span>
              <span class="text-xs text-slate-400 font-normal">Speeds up</span>
            </button>
          </div>

          <button id="startBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black text-lg tracking-wider shadow-lg shadow-emerald-500/25 transition-all transform hover:scale-[1.02] active:scale-95">
            PLAY NOW
          </button>
        </div>

        <!-- PAUSE MODE -->
        <div id="menuPause" class="hidden flex-col items-center gap-5">
          <h2 class="text-4xl font-black text-amber-400 tracking-wider">GAME PAUSED</h2>
          <p class="text-slate-300 text-sm">Take a breather!</p>
          <div class="flex flex-col gap-2.5 w-full max-w-xs">
            <button id="resumeBtn" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg shadow-lg shadow-emerald-500/20 transition-all transform hover:scale-105 active:scale-95">
              RESUME
            </button>
            <button id="pauseMainMenuBtn" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-sm transition-all">
              MAIN MENU
            </button>
          </div>
        </div>

        <!-- GAME OVER MODE -->
        <div id="menuOver" class="hidden flex-col items-center gap-4 w-full max-w-xs">
          <div class="space-y-1">
            <h2 id="overTitle" class="text-4xl font-black text-rose-500 neon-text-pink tracking-wider">GAME OVER</h2>
            <p id="overSubtitle" class="text-xs text-slate-400">You crashed into yourself!</p>
          </div>

          <div class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex justify-around">
            <div class="text-center">
              <div class="text-xs text-slate-400 uppercase font-bold">Final Score</div>
              <div id="finalScore" class="text-2xl font-black text-emerald-400">0</div>
            </div>
            <div class="w-px bg-slate-800"></div>
            <div class="text-center">
              <div class="text-xs text-slate-400 uppercase font-bold">Best Score</div>
              <div id="finalBest" class="text-2xl font-black text-cyan-400">0</div>
            </div>
          </div>

          <div class="flex flex-col gap-2 w-full">
            <button id="restartBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black text-lg tracking-wider shadow-lg shadow-emerald-500/25 transition-all transform hover:scale-[1.02] active:scale-95">
              PLAY AGAIN
            </button>
            <button id="overMainMenuBtn" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-sm transition-all">
              MAIN MENU
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls Helper & Mobile Touch D-Pad -->
    <div class="w-full flex flex-col items-center gap-3">
      <p class="text-xs text-slate-400 text-center hidden sm:block">
        Use <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">Arrow Keys</kbd> or <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">WASD</kbd> to change direction · <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">Space</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">P</kbd> to Pause · Swipe on canvas supported
      </p>

      <!-- On-Screen Directional Pad for Mobile -->
      <div class="grid grid-cols-3 grid-rows-2 gap-2 w-48 sm:hidden mt-1" aria-label="Touch D-Pad Controls">
        <div></div>
        <button class="d-pad-btn py-3.5 rounded-xl text-white font-black text-xl flex items-center justify-center" data-dir="up" aria-label="Up">▲</button>
        <div></div>
        <button class="d-pad-btn py-3.5 rounded-xl text-white font-black text-xl flex items-center justify-center" data-dir="left" aria-label="Left">◀</button>
        <button class="d-pad-btn py-3.5 rounded-xl text-white font-black text-xl flex items-center justify-center" data-dir="down" aria-label="Down">▼</button>
        <button class="d-pad-btn py-3.5 rounded-xl text-white font-black text-xl flex items-center justify-center" data-dir="right" aria-label="Right">▶</button>
      </div>
    </div>

  </main>

  <script>
    /* ==========================================================================
       AUDIO SYNTHESIZER (Web Audio API - No External Assets)
       ========================================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playEat() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playPowerup() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(440, now + 0.06);
        osc.frequency.setValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.22);
      }

      playGameOver() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.4);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.4);
      }

      playClick() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      }
    }

    const sfx = new SoundFX();

    /* ==========================================================================
       GAME ENGINE & STATE
       ========================================================================== */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // UI Elements
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const menuStart = document.getElementById("menuStart");
    const menuPause = document.getElementById("menuPause");
    const menuOver = document.getElementById("menuOver");
    const finalScore = document.getElementById("finalScore");
    const finalBest = document.getElementById("finalBest");
    const overTitle = document.getElementById("overTitle");
    const overSubtitle = document.getElementById("overSubtitle");
    const powerupStatus = document.getElementById("powerupStatus");
    const powerupIcon = document.getElementById("powerupIcon");
    const powerupText = document.getElementById("powerupText");

    // Game Configuration
    const GRID_SIZE = 20; // 20x20 grid
    let cellSize = 0;

    // Difficulty Speed Settings (ms per logic step)
    const SPEEDS = {
      easy: 130,
      medium: 95,
      hard: 65,
      progressive: 110
    };
    let selectedMode = 'medium';
    let currentStepDelay = SPEEDS.medium;

    // Game State Variables
    let snake = [];
    let prevSnake = []; // Used for sub-frame visual interpolation
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = null; // { x, y, type: 'apple' | 'golden' | 'slow' | 'shrink', duration: timestamp }
    let particles = [];
    let floatingTexts = [];
    let score = 0;
    let bestScore = 0;
    let gameState = "menu"; // "menu", "playing", "paused", "over"
    let turnBuffer = [];

    // Active Power-up Timers
    let activePowerup = null; // { type, expiresAt }

    // Logic timing accumulator variables for requestAnimationFrame
    let lastTime = 0;
    let accumulator = 0;

    /* Load saved high score */
    try {
      bestScore = Number(localStorage.getItem("cyber-snake-best")) || 0;
    } catch {
      bestScore = 0;
    }
    bestEl.textContent = bestScore;

    /* Resize & Crisp Rendering */
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      cellSize = canvas.width / GRID_SIZE;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /* ==========================================================================
       FOOD & POWER-UPS SYSTEM
       ========================================================================== */
    function spawnFood() {
      const emptyCells = [];
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          if (!snake.some(segment => segment.x === x && segment.y === y)) {
            emptyCells.push({ x, y });
          }
        }
      }
      if (!emptyCells.length) return null;

      const pos = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      
      // Determine food type probabilities
      const rand = Math.random();
      let type = 'apple';
      if (rand > 0.88) type = 'golden';    // 12% Golden Apple (3x score)
      else if (rand > 0.78) type = 'slow'; // 10% Slow Berry
      else if (rand > 0.70) type = 'shrink';// 8% Shrink Berry

      return {
        x: pos.x,
        y: pos.y,
        type: type,
        spawnedAt: performance.now()
      };
    }

    /* ==========================================================================
       PARTICLE & FLOATING TEXT FX
       ========================================================================== */
    function createExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 3 + 1) * (cellSize / 30);
        particles.push({
          x: (x + 0.5) * cellSize,
          y: (y + 0.5) * cellSize,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          radius: Math.random() * 3 + 2,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function createFloatingText(text, x, y, color) {
      floatingTexts.push({
        text,
        x: (x + 0.5) * cellSize,
        y: (y + 0.5) * cellSize,
        color,
        alpha: 1,
        vy: -1.2
      });
    }

    function updateEffects() {
      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    /* ==========================================================================
       GAME INIT & LOGIC STEP
       ========================================================================== */
    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      prevSnake = JSON.parse(JSON.stringify(snake));
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      turnBuffer = [];
      score = 0;
      activePowerup = null;
      currentStepDelay = SPEEDS[selectedMode];
      scoreEl.textContent = score;
      powerupStatus.classList.add('hidden');

      food = spawnFood();
      particles = [];
      floatingTexts = [];
    }

    function startGame() {
      sfx.init();
      sfx.playClick();
      resetGame();
      gameState = "playing";
      hideOverlay();
      lastTime = performance.now();
      accumulator = 0;
    }

    function pauseGame() {
      if (gameState === "playing") {
        gameState = "paused";
        showOverlay("pause");
      } else if (gameState === "paused") {
        gameState = "playing";
        hideOverlay();
        lastTime = performance.now();
      }
    }

    function triggerGameOver(reasonText = "You crashed!") {
      sfx.playGameOver();
      gameState = "over";
      
      // Explosion at snake head
      if (snake.length > 0) {
        createExplosion(snake[0].x, snake[0].y, "#ff2a6d", 30);
      }

      finalScore.textContent = score;
      finalBest.textContent = bestScore;
      overSubtitle.textContent = reasonText;
      showOverlay("over");
    }

    function setDirection(newDir) {
      if (gameState !== "playing") return;
      
      // Prevent rapid double clicks turning 180 degrees into self
      const lastBufferedDir = turnBuffer.length > 0 ? turnBuffer[turnBuffer.length - 1] : direction;
      if (newDir.x === -lastBufferedDir.x && newDir.y === -lastBufferedDir.y) return;
      if (newDir.x === lastBufferedDir.x && newDir.y === lastBufferedDir.y) return;

      if (turnBuffer.length < 2) {
        turnBuffer.push(newDir);
      }
    }

    /* Logic Update (Runs at fixed tick intervals) */
    function updateGameLogic() {
      if (gameState !== "playing") return;

      // Handle Direction Queue
      if (turnBuffer.length > 0) {
        direction = turnBuffer.shift();
      }

      // Check Active Powerup Expiration
      if (activePowerup && performance.now() > activePowerup.expiresAt) {
        activePowerup = null;
        powerupStatus.classList.add('hidden');
        if (selectedMode !== 'progressive') currentStepDelay = SPEEDS[selectedMode];
      }

      // Snapshot previous positions for visual smoothing
      prevSnake = JSON.parse(JSON.stringify(snake));

      // Compute Head Target Position
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall Collisions
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        triggerGameOver("Crashed into the border wall!");
        return;
      }

      // Self Collisions
      const hitSelf = snake.some((part, idx) => {
        // Exclude tail if it's going to move away unless eating
        if (idx === snake.length - 1 && !(food && head.x === food.x && head.y === food.y)) return false;
        return part.x === head.x && part.y === head.y;
      });

      if (hitSelf) {
        triggerGameOver("Bit your own tail!");
        return;
      }

      // Check Food Eating
      const eating = food && head.x === food.x && head.y === food.y;

      snake.unshift(head);

      if (eating) {
        handleFoodEaten(food);
        food = spawnFood();
        
        // Dynamic speed increment for Progressive mode
        if (selectedMode === 'progressive' && (!activePowerup || activePowerup.type !== 'slow')) {
          currentStepDelay = Math.max(50, 110 - Math.floor(score / 30) * 4);
        }
      } else {
        snake.pop();
      }
    }

    function handleFoodEaten(item) {
      let points = 10;
      let popupColor = "#20e3b2";
      let popupText = "+10";

      if (item.type === 'golden') {
        points = 30;
        popupColor = "#fbbf24";
        popupText = "+30 🌟";
        sfx.playPowerup();
        createExplosion(item.x, item.y, "#fbbf24", 25);
      } else if (item.type === 'slow') {
        points = 15;
        popupColor = "#38bdf8";
        popupText = "SLOW MOTION ❄️";
        activePowerup = { type: 'slow', expiresAt: performance.now() + 6000 };
        currentStepDelay = Math.floor(SPEEDS[selectedMode] * 1.6);
        showPowerupUI("❄️ SLOW MOTION", "text-sky-400");
        sfx.playPowerup();
        createExplosion(item.x, item.y, "#38bdf8", 20);
      } else if (item.type === 'shrink') {
        points = 15;
        popupColor = "#f43f5e";
        popupText = "SHRINK SNAKE ✂️";
        if (snake.length > 3) {
          snake.splice(Math.max(3, snake.length - 2));
        }
        sfx.playPowerup();
        createExplosion(item.x, item.y, "#f43f5e", 20);
      } else {
        sfx.playEat();
        createExplosion(item.x, item.y, "#20e3b2", 15);
      }

      score += points;
      scoreEl.textContent = score;

      if (score > bestScore) {
        bestScore = score;
        bestEl.textContent = bestScore;
        try { localStorage.setItem("cyber-snake-best", bestScore); } catch {}
      }

      createFloatingText(popupText, item.x, item.y, popupColor);
    }

    function showPowerupUI(text, colorClass) {
      powerupText.textContent = text;
      powerupStatus.className = `flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 ${colorClass} text-xs font-bold animate-pulse`;
    }

    /* ==========================================================================
       RENDERING ENGINE (Sub-frame interpolation & Neon Arcade FX)
       ========================================================================== */
    function render(interp) {
      // Clear screen
      ctx.fillStyle = "#0a0f18";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Arcade Grid
      drawGrid();

      // Draw Food
      if (food) drawFood(food);

      // Draw Snake with Interpolated Motion
      if (snake.length > 0) {
        drawSnake(interp);
      }

      // Draw FX Particles & Floating Score Text
      drawParticles();
      drawFloatingTexts();
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(30, 41, 59, 0.4)";
      ctx.lineWidth = 1;

      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = Math.floor(i * cellSize);
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }
    }

    function drawFood(item) {
      const cx = (item.x + 0.5) * cellSize;
      const cy = (item.y + 0.5) * cellSize;
      const radius = cellSize * 0.38;
      const pulse = Math.sin(performance.now() * 0.008) * 0.08 + 1;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse, pulse);

      if (item.type === 'golden') {
        // Glowing Golden Apple
        ctx.shadowColor = "#fbbf24";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        // Inner shine
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-radius * 0.3, -radius * 0.3, radius * 0.25, 0, Math.PI * 2);
        ctx.fill();
      } else if (item.type === 'slow') {
        // Ice Slow Berry
        ctx.shadowColor = "#38bdf8";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.roundRect(-radius, -radius, radius * 2, radius * 2, 6);
        ctx.fill();
      } else if (item.type === 'shrink') {
        // Pink Shrink Berry
        ctx.shadowColor = "#f43f5e";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#f43f5e";
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Standard Glowing Cyber Apple
        ctx.shadowColor = "#20e3b2";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "#20e3b2";
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-radius * 0.3, -radius * 0.3, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawSnake(interp) {
      // Clamp interpolation between 0 and 1
      const t = Math.max(0, Math.min(1, interp));

      // Render segments from tail to head for correct overlapping
      for (let i = snake.length - 1; i >= 0; i--) {
        const curr = snake[i];
        const prev = prevSnake[i] || curr;

        // Linear interpolation for silky smooth movement between steps
        const renderX = prev.x + (curr.x - prev.x) * t;
        const renderY = prev.y + (curr.y - prev.y) * t;

        const x = renderX * cellSize;
        const y = renderY * cellSize;

        // Body Tapering & Sizing
        const isHead = i === 0;
        const sizeFactor = isHead ? 0.92 : Math.max(0.6, 0.88 - (i / snake.length) * 0.25);
        const segmentSize = cellSize * sizeFactor;
        const offset = (cellSize - segmentSize) / 2;

        ctx.save();
        
        if (isHead) {
          // Snake Head Drawing
          ctx.shadowColor = "#20e3b2";
          ctx.shadowBlur = 15;
          ctx.fillStyle = "#a7f3d0"; // Bright glowing mint

          ctx.beginPath();
          ctx.roundRect(x + offset, y + offset, segmentSize, segmentSize, segmentSize * 0.4);
          ctx.fill();

          // Animated Cute Eyes
          drawSnakeEyes(x + cellSize / 2, y + cellSize / 2, direction);
        } else {
          // Snake Body Gradient & Taper
          const hue = (160 + i * 2) % 360;
          ctx.fillStyle = `hsl(${hue}, 80%, ${Math.max(35, 60 - i * 1.5)}%)`;

          ctx.beginPath();
          ctx.roundRect(x + offset, y + offset, segmentSize, segmentSize, segmentSize * 0.3);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function drawSnakeEyes(headCx, headCy, dir) {
      const eyeOffset = cellSize * 0.22;
      const eyeRadius = cellSize * 0.1;
      const pupilRadius = cellSize * 0.05;

      let eye1 = { x: 0, y: 0 };
      let eye2 = { x: 0, y: 0 };

      if (dir.x === 1) { // Right
        eye1 = { x: headCx + eyeOffset, y: headCy - eyeOffset };
        eye2 = { x: headCx + eyeOffset, y: headCy + eyeOffset };
      } else if (dir.x === -1) { // Left
        eye1 = { x: headCx - eyeOffset, y: headCy - eyeOffset };
        eye2 = { x: headCx - eyeOffset, y: headCy + eyeOffset };
      } else if (dir.y === -1) { // Up
        eye1 = { x: headCx - eyeOffset, y: headCy - eyeOffset };
        eye2 = { x: headCx + eyeOffset, y: headCy - eyeOffset };
      } else { // Down
        eye1 = { x: headCx - eyeOffset, y: headCy + eyeOffset };
        eye2 = { x: headCx + eyeOffset, y: headCy + eyeOffset };
      }

      // Whites
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(eye1.x, eye1.y, eyeRadius, 0, Math.PI * 2);
      ctx.arc(eye2.x, eye2.y, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      // Pupils facing motion
      ctx.fillStyle = "#080b11";
      ctx.beginPath();
      ctx.arc(eye1.x + dir.x * 1.5, eye1.y + dir.y * 1.5, pupilRadius, 0, Math.PI * 2);
      ctx.arc(eye2.x + dir.x * 1.5, eye2.y + dir.y * 1.5, pupilRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawFloatingTexts() {
      floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.font = `800 ${Math.floor(cellSize * 0.6)}px Outfit, sans-serif`;
        ctx.textAlign = "center";
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 10;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });
    }

    /* ==========================================================================
       MAIN GAME LOOP (requestAnimationFrame with accumulator)
       ========================================================================== */
    function gameLoop(time) {
      requestAnimationFrame(gameLoop);

      if (!lastTime) lastTime = time;
      const deltaTime = time - lastTime;
      lastTime = time;

      if (gameState === "playing") {
        accumulator += deltaTime;

        // Run logic ticks based on exact speed delay
        while (accumulator >= currentStepDelay) {
          updateGameLogic();
          accumulator -= currentStepDelay;
        }
      }

      // Sub-frame interpolation ratio (0.0 to 1.0)
      const interp = gameState === "playing" ? (accumulator / currentStepDelay) : 1;

      updateEffects();
      render(interp);
    }

    // Start Animation Loop on load
    window.onload = () => {
      resetGame();
      requestAnimationFrame(gameLoop);
    };

    /* ==========================================================================
       USER INPUTS & CONTROLS
       ========================================================================== */
    // Keyboard Controls
    const KEY_MAP = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 }
    };

    document.addEventListener("keydown", (e) => {
      sfx.init();

      if (KEY_MAP[e.key]) {
        e.preventDefault();
        setDirection(KEY_MAP[e.key]);
      } else if (e.key === " " || e.key.toLowerCase() === "p") {
        e.preventDefault();
        pauseGame();
      } else if (e.key === "Enter" && gameState !== "playing") {
        startGame();
      }
    });

    // Touch Pad Button Event Listeners
    document.querySelectorAll("[data-dir]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        sfx.init();
        const dirStr = btn.dataset.dir;
        const dirObj = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        }[dirStr];
        if (dirObj) setDirection(dirObj);
      });
    });

    // Mobile Canvas Swipe Gesture Detection
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener("touchstart", (e) => {
      sfx.init();
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 0) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const minSwipe = 25;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > minSwipe) {
          setDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
        }
      } else {
        if (Math.abs(dy) > minSwipe) {
          setDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
        }
      }
    }, { passive: true });

    /* ==========================================================================
       UI OVERLAY MENUS & SOUND TOGGLE
       ========================================================================== */
    function showOverlay(menuType) {
      overlay.classList.remove("opacity-0", "pointer-events-none");
      overlay.classList.add("opacity-100");

      menuStart.classList.add("hidden");
      menuPause.classList.add("hidden");
      menuOver.classList.add("hidden");

      if (menuType === "start") menuStart.classList.remove("hidden");
      if (menuType === "pause") menuPause.classList.remove("hidden");
      if (menuType === "over") menuOver.classList.remove("hidden");
    }

    function hideOverlay() {
      overlay.classList.remove("opacity-100");
      overlay.classList.add("opacity-0", "pointer-events-none");
    }

    // Difficulty Mode Selection Buttons
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        sfx.playClick();
        document.querySelectorAll(".mode-btn").forEach(b => {
          b.className = "mode-btn py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700/60 border border-slate-700 font-bold text-slate-200 transition-all flex justify-between items-center";
        });
        btn.className = "mode-btn py-3 px-4 rounded-xl bg-emerald-500/20 border-2 border-emerald-500 font-bold text-emerald-300 transition-all flex justify-between items-center shadow-lg shadow-emerald-500/10";
        selectedMode = btn.dataset.speed;
      });
    });

    // Action Buttons
    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("restartBtn").addEventListener("click", startGame);
    document.getElementById("resumeBtn").addEventListener("click", pauseGame);

    // Main Menu Navigation
    const goToMainMenu = () => {
      sfx.playClick();
      gameState = "menu";
      showOverlay("start");
    };
    document.getElementById("pauseMainMenuBtn").addEventListener("click", goToMainMenu);
    document.getElementById("overMainMenuBtn").addEventListener("click", goToMainMenu);

    // Mute/Unmute Audio Toggle
    const soundToggle = document.getElementById("soundToggle");
    const soundIconOn = document.getElementById("soundIconOn");
    const soundIconOff = document.getElementById("soundIconOff");

    soundToggle.addEventListener("click", () => {
      sfx.muted = !sfx.muted;
      if (sfx.muted) {
        soundIconOn.classList.add("hidden");
        soundIconOff.classList.remove("hidden");
      } else {
        soundIconOff.classList.add("hidden");
        soundIconOn.classList.remove("hidden");
        sfx.init();
        sfx.playClick();
      }
    });

  </script>
</body>
</html>
